# The iPhone app's Xcode project, generated by XcodeGen: `cd ios && xcodegen`.
# Signing: put `DEVELOPMENT_TEAM = <your team>` in ios/Local.xcconfig, which is never committed.
name: Quire
options:
  bundleIdPrefix: com.openedtools
  deploymentTarget:
    iOS: "26.0"
  createIntermediateGroups: true
configFiles:
  Debug: Shared.xcconfig
  Release: Shared.xcconfig
packages:
  VaultKit:
    path: VaultKit
  # Parakeet on the Neural Engine (Apache-2.0), exactly this version (plan PI3)
  FluidAudio:
    url: https://github.com/FluidInference/FluidAudio
    exactVersion: 0.18.2
targets:
  Quire:
    type: application
    platform: iOS
    sources: [Quire]
    dependencies:
      - package: VaultKit
        product: VaultKit
      - package: VaultKit
        product: RecordingKit
      - package: FluidAudio
    info:
      path: Quire/Info.plist
      properties:
        CFBundleDisplayName: Quire
        UILaunchScreen: {}
        UISupportedInterfaceOrientations: [UIInterfaceOrientationPortrait]
        ITSAppUsesNonExemptEncryption: false
        NSMicrophoneUsageDescription: Quire records meetings and transcribes them on this iPhone.
        UIBackgroundModes: [audio, fetch]
        BGTaskSchedulerPermittedIdentifiers: [com.openedtools.notes.sweep]
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.openedtools.notes
        ASSETCATALOG_COMPILER_APPICON_NAME: AppIcon
        TARGETED_DEVICE_FAMILY: "1"
        SWIFT_VERSION: "6.0"
        GENERATE_INFOPLIST_FILE: NO
        CURRENT_PROJECT_VERSION: "1"
        MARKETING_VERSION: "0.1.0"
  QuireTests:
    type: bundle.unit-test
    platform: iOS
    sources: [QuireTests]
    dependencies:
      - target: Quire
      - package: VaultKit
        product: VaultKit
    settings:
      base:
        GENERATE_INFOPLIST_FILE: YES
        SWIFT_VERSION: "6.0"
  QuireUITests:
    type: bundle.ui-testing
    platform: iOS
    sources: [QuireUITests]
    dependencies:
      - target: Quire
      - package: VaultKit
        product: RecordingKit
    settings:
      base:
        GENERATE_INFOPLIST_FILE: YES
        SWIFT_VERSION: "6.0"
schemes:
  Quire:
    build:
      targets:
        Quire: all
        QuireTests: [test]
        QuireUITests: [test]
    test:
      targets: [QuireTests, QuireUITests]
